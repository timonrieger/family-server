---
- name: Setup Restic Backup
  hosts: beelink
  become: true
  vars:
    restic_user: restic
    restic_home: "/home/restic"
    mirror_script_dest: "/root/mirror.sh"
    backup_log: "/home/restic/backup.log"
    mirror_log: "/root/mirror.log"
    backup_cron_hour: 2
    backup_cron_minute: 0
    mirror_cron_hour: 5
    mirror_cron_minute: 5

  tasks:
    - name: Ensure prerequisite apt packages are present
      ansible.builtin.apt:
        name:
          - restic
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Install rclone using official install script
      ansible.builtin.shell: curl https://rclone.org/install.sh | sudo bash
      args:
        creates: /usr/bin/rclone

    - name: Create restic system user
      ansible.builtin.user:
        name: "{{ restic_user }}"
        system: true
        create_home: true
        shell: /usr/sbin/nologin
        state: present

    - name: Lock down restic binary
      ansible.builtin.file:
        path: /usr/bin/restic
        owner: root
        group: "{{ restic_user }}"
        mode: '0750'

    - name: Check restic binary capabilities
      ansible.builtin.command: getcap /usr/bin/restic
      register: restic_caps
      changed_when: false

    - name: Add DAC_READ_SEARCH capability to restic binary
      ansible.builtin.command: setcap cap_dac_read_search=+ep /usr/bin/restic
      when: "'cap_dac_read_search' not in restic_caps.stdout"

    - name: Ensure restic cache directory exists
      ansible.builtin.file:
        path: "{{ restic_home }}/.cache/restic"
        state: directory
        owner: "{{ restic_user }}"
        group: "{{ restic_user }}"
        mode: '0700'

    - name: Copy restic backup script
      ansible.builtin.copy:
        src: files/backup.sh
        dest: "{{ restic_home }}/backup.sh"
        owner: "{{ restic_user }}"
        group: "{{ restic_user }}"
        mode: '0700'

    - name: Ensure rclone config directory exists
      ansible.builtin.file:
        path: "{{ restic_home }}/.config/rclone"
        state: directory
        owner: "{{ restic_user }}"
        group: "{{ restic_user }}"
        mode: '0700'

    - name: Copy rclone config for restic user
      ansible.builtin.copy:
        src: files/rclone.conf
        dest: "{{ restic_home }}/.config/rclone/rclone.conf"
        owner: "{{ restic_user }}"
        group: "{{ restic_user }}"
        mode: '0600'

    - name: Ensure backup log file exists
      ansible.builtin.file:
        path: "{{ backup_log }}"
        state: touch
        owner: "{{ restic_user }}"
        group: "{{ restic_user }}"
        mode: '0644'

    - name: Set cronjob for restic backup
      ansible.builtin.cron:
        name: "restic system backup"
        user: root
        minute: "{{ backup_cron_minute }}"
        hour: "{{ backup_cron_hour }}"
        job: "sudo -u {{ restic_user }} {{ restic_home }}/backup.sh >> {{ backup_log }} 2>&1"

    - name: Copy mirror script
      ansible.builtin.copy:
        src: files/mirror.sh
        dest: "{{ mirror_script_dest }}"
        owner: root
        group: root
        mode: '0700'

    - name: Ensure mirror log file exists
      ansible.builtin.file:
        path: "{{ mirror_log }}"
        state: touch
        owner: root
        group: root
        mode: '0644'

    - name: Set cronjob for secondary HDD mirror
      ansible.builtin.cron:
        name: "mirror originals to secondary hdd"
        user: root
        minute: "{{ mirror_cron_minute }}"
        hour: "{{ mirror_cron_hour }}"
        job: "{{ mirror_script_dest }} >> {{ mirror_log }} 2>&1"
