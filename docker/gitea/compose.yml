services:
  server:
    image: gitea/gitea:1.27.3@sha256:d584940b7143982682ac4541509dd628506c2b568221e6af41e5a2ead1de4fe7
    container_name: gitea
    restart: unless-stopped
    environment:
      # Exception to the non-root rule: the image's init needs root, but the
      # internal git user is mapped to the gitea system user (setup-permissions.yaml)
      - USER_UID=2002
      - USER_GID=2002
    networks:
      - gitea
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  gitea:
    external: true
