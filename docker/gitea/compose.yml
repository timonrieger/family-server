services:
  server:
    image: gitea/gitea:1.27.1@sha256:b64126cf5c3f4e5f0f231b510bb13715f6cb8e508188b44de90bdb9a04f3055d
    container_name: gitea
    restart: unless-stopped
    environment:
      # Exception to the non-root rule: the image's init needs root, but the
      # internal git user is mapped to the gitea system user (setup-permissions.yaml)
      - USER_UID=2002
      - USER_GID=2002
    networks:
      - gitea
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  gitea:
    external: true
