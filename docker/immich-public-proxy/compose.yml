services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:3.1.0@sha256:2f5021a317ebd22e544e68b896c79c7df573fc67f7e2f50f9fb6746a544508b5
    container_name: immich-public-proxy
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PUBLIC_BASE_URL: https://immpub.timonrieger.de
      IMMICH_URL: http://beelink:2283
    healthcheck:
      test: curl -s http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    volumes:
      - ./config.json:/app/config.json:ro
