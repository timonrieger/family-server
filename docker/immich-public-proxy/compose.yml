services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:3.2.0@sha256:5af9a12815699942c3055f0f90608c75f955224963fc5912ea221f6ec26ccb8c
    container_name: immich-public-proxy
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PUBLIC_BASE_URL: https://immpub.timonrieger.de
      IMMICH_URL: http://beelink:2283
    healthcheck:
      test: curl -s http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    volumes:
      - ./config.json:/app/config.json:ro
